plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def sdl3SourceDir = localProperties.getProperty('gow2.sdl3.dir') ?: providers.gradleProperty('gow2.sdl3.dir').getOrNull()
if (!sdl3SourceDir || !file("${sdl3SourceDir}/CMakeLists.txt").exists()) {
    throw new GradleException("Set gow2.sdl3.dir in android/local.properties to the SDL3 source tree " +
            "(thirdparty/sdl3 of a ReXGlue SDK checkout); got '${sdl3SourceDir}'.")
}
def gameLibraries = providers.gradleProperty('gow2.gameLibraries').getOrElse('false').toBoolean()

android {
    namespace = 'com.santiquiroz.gow2recomp'
    compileSdk = 36
    ndkVersion = '30.0.14904198'

    defaultConfig {
        applicationId = 'com.santiquiroz.gow2recomp'
        minSdk = 29
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0-shell'
        buildConfigField 'boolean', 'GAME_LIBRARIES', gameLibraries.toString()
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                        "-DGOW2_SDL3_SOURCE_DIR=${sdl3SourceDir.replace('\\', '/')}"
                // Same baseline as the SDK's Android build (scripts/build-sdk-android.ps1).
                cFlags '-march=armv8.2-a'
                cppFlags '-march=armv8.2-a'
                targets 'gow2shell', 'SDL3-shared'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '4.1.2'
        }
    }

    packaging {
        jniLibs {
            // Uncompressed and 16 KB aligned inside the APK, loaded from there without extraction.
            useLegacyPackaging = false
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
