org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true

# Which native libraries Gow2Activity loads (see NativeLibraries.java).
#   false: the placeholder shell, libSDL3.so + libgow2shell.so, built from app/src/main/cpp.
#   true:  the real game, libSDL3.so + librexruntime.so + librexgpu-xenos.so + libgow2.so, prebuilt
#          by scripts/build-android.ps1 into out/android/jniLibs (gow2.gameLibs.dir overrides it).
gow2.gameLibraries=false
